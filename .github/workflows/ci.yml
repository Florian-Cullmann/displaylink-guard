name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Shell syntax and installer failure paths
        run: |
          bash -n scripts/install.sh
          sh -n scripts/permission.sh
          python3 Tests/InstallerTests/test_install.py
      - name: Unit tests
        run: swift test
      - name: Release build
        run: swift build --configuration release
      - name: CLI smoke test
        run: .build/release/displaylink-guard --help
